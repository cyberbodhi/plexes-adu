                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(map);

            // Format millisecond timestamp into YYYY-MM-DD
            function formatDate(ms) {
                if (!ms || isNaN(ms)) return "<em>N/A</em>";
                const d = new Date(Number(ms));
                return d.toISOString().split('T')[0];
            }

            function createPopupContent(properties) {
                if (!properties || Object.keys(properties).length === 0) {
                    return "<em>No properties recorded.</em>";
                }
                let html = '<table class="popup-table">';
                for (const [key, value] of Object.entries(properties)) {
                    let valText;
                    if (key.toLowerCase() === 'approvaldate') {
                        valText = formatDate(value);
                    } else {
                        valText = (value === null || value === undefined) ? "<em>N/A</em>" : value;
                    }

                    html += `<tr><td class="popup-key">${key}</td><td class="popup-value">${valText}</td></tr>`;
                }
                html += '</table>';
                return html;
            }

            const defaultMarkerStyle = {
                radius: 7,
                fillColor: "#3388ff",
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.85
            };

            const hoverMarkerStyle = {
                radius: 11,
                fillColor: "#ff7800",
                color: "#ffffff",
                weight: 3,
                opacity: 1,
                fillOpacity: 1.0
            };

            const geojsonLayer = L.geoJSON(geojsonData, {
                pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, defaultMarkerStyle);
                },
                onEachFeature: function(feature, layer) {
                    const popupContent = createPopupContent(feature.properties);

                    layer.bindPopup(popupContent, {
                        offset: L.point(0, -14),
                        closeButton: false,
                        autoPan: false
                    });

                    layer.on('mouseover', function(e) {
                        this.setStyle(hoverMarkerStyle);
                        this.bringToFront();
                        this.openPopup();
                    });

                    layer.on('mouseout', function(e) {
                        this.setStyle(defaultMarkerStyle);
                        this.closePopup();
                    });
                }
            }).addTo(map);

            if (geojsonLayer.getLayers().length > 0) {
                map.fitBounds(geojsonLayer.getBounds(), { padding: [50, 50] });
            }
        });
    </script>
</body>
</html>
